<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24130a">
<title>वैदिक वाणी — संस्कृत पाठ एवं हिंदी व्याख्या</title>
<style>
:root{
 --ink:#21150e;--paper:#fffaf0;--cream:#f3e5cb;--brown:#3a1e0d;
 --saffron:#a95d20;--gold:#e5b85c;--green:#286247;--white:#fff;
 --shadow:0 24px 70px rgba(45,25,10,.22)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Nirmala UI",sans-serif;background:radial-gradient(circle at 20% 10%,#fff7e7,#e8d7bd 70%);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100dvh;display:grid;place-items:center;padding:10px}
.frame{width:min(100%,430px);height:min(calc(100dvh - 20px),764px);aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:30px;background:var(--paper);box-shadow:var(--shadow)}
.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:flex;flex-direction:column}
.screen.enter{animation:enter .32s ease}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
/* reader */
.reader{background:linear-gradient(160deg,#1b0d06,#4c260f 45%,#a85b1d 100%);color:#fff}
.glow{position:absolute;border-radius:50%;filter:blur(25px);pointer-events:none}
.g1{width:240px;height:240px;right:-120px;top:-70px;background:#efb84d;opacity:.24}
.g2{width:220px;height:220px;left:-140px;bottom:-90px;background:#c95b24;opacity:.25}
.topbar{position:relative;z-index:2;padding:15px 15px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:9px}.om{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:25px}
.brand b{display:block;font-size:15px}.brand span{display:block;font-size:9px;color:#f6dcc0;margin-top:2px}
.top-actions{display:flex;gap:6px}.icon{width:38px;height:38px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.11);color:#fff;display:grid;place-items:center}
.progress{position:relative;z-index:2;height:4px;margin:0 15px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd36c,#fff1bd);transition:.3s}
.stage{position:relative;z-index:2;flex:1;min-height:0;padding:13px 13px 10px;display:flex;flex-direction:column;overflow:hidden}
.panel{display:none;flex-direction:column;flex:1;min-height:0;animation:panelIn .3s ease}.panel.active{display:flex}
@keyframes panelIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.panel-title{text-align:center;font-size:12px;font-weight:900;color:#ffe6ba;margin-bottom:8px}

.rolling-line{
  margin:0 0 8px;
  padding:0;
  opacity:.88;
  transform:translateY(6px);
  transition:opacity .25s ease,transform .25s ease;
}
.active-line{
  opacity:1;
  transform:none;
}
.final-line{
  white-space:pre-wrap;
  margin:0;
}
.textbox{flex:1;min-height:0;overflow:auto;border-radius:24px;padding:22px 18px;background:linear-gradient(145deg,rgba(255,253,247,.98),rgba(255,246,225,.98));color:#28180d;border:2px solid rgba(235,194,106,.7);box-shadow:0 18px 40px rgba(0,0,0,.2);scroll-behavior:smooth;white-space:pre-wrap;overflow-wrap:anywhere;font-family:"Noto Serif Devanagari","Noto Sans Devanagari","Nirmala UI",serif;font-size:clamp(22px,6vw,29px);font-weight:650;line-height:1.8;scrollbar-width:thin}
.explain .textbox{background:linear-gradient(145deg,#f7fff8,#eaf6ee);border-color:rgba(87,147,111,.65);font-size:clamp(19px,5vw,25px);line-height:1.75;color:#173d29}
.controls{position:relative;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn{border:0;border-radius:15px;padding:12px 10px;font-weight:950}.play{background:linear-gradient(135deg,#fff4cf,#e9b957);color:#4b270f;box-shadow:0 9px 22px rgba(0,0,0,.18)}.back{background:rgba(255,255,255,.11);color:#fff;border:1px solid rgba(255,255,255,.22)}.repeat{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.23)}.edit{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
/* editor */
.editor{background:#f6efe3;color:var(--ink)}.edhead{background:linear-gradient(135deg,#3a1e0d,#96541c);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}.edhead h2{margin:0;font-size:18px}.edcontent{flex:1;overflow:auto;padding:13px}.card{background:#fffdf8;border:1px solid #e2d3bd;border-radius:19px;padding:13px;margin-bottom:11px;box-shadow:0 7px 22px rgba(60,35,15,.07)}.card h3{font-size:13px;margin:0 0 8px;color:#87501f}.label{display:block;font-size:10px;font-weight:900;color:#756658;margin:7px 0 4px}.textarea{width:100%;border:1px solid #d8c8b0;border-radius:13px;padding:11px;background:#fffefa;outline:none;resize:vertical;line-height:1.65;color:#25170e}.sanskritInput{min-height:230px;font-size:20px}.hindiInput{min-height:170px;font-size:17px}.select{width:100%;border:1px solid #d8c8b0;border-radius:11px;padding:9px;background:#fffefa}.edbuttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;bottom:0;padding:10px 0 2px;background:linear-gradient(180deg,rgba(246,239,227,0),#f6efe3 25%)}.save{background:#286247;color:#fff}.cancel{background:#3a2415;color:#fff}
/* responsive */
@media(max-height:680px){.frame{height:calc(100dvh - 10px);border-radius:21px}.textbox{padding:17px;font-size:21px}.explain .textbox{font-size:18px}.topbar{padding:10px 12px}.stage{padding:9px}.controls .btn{padding:9px}}
</style>
</head>
<body>
<div class="app"><main class="frame">

<section id="reader" class="screen reader active">
<div class="glow g1"></div><div class="glow g2"></div>
<div class="topbar">
  <div class="brand"><div class="om">ॐ</div><div><b>वैदिक वाणी</b><span>संस्कृत पाठ • हिंदी व्याख्या</span></div></div>
  <div class="top-actions"><button id="editOpen" class="icon" title="संपादित करें">✏️</button><button id="mute" class="icon" title="मौन">🔊</button></div>
</div>
<div class="progress"><i id="progress"></i></div>

<div class="stage">

  <div id="sanskritPanel" class="panel active">
    <div class="panel-title" id="sanskritLabel">📜 वैदिक संस्कृत • ऋचा / मंत्र / श्लोक / गद्य</div>
    <div id="sanskritText" class="textbox"></div>
    <div class="controls">
      <button id="play" class="btn play">▶️ संस्कृत से शुरू करें</button>
      <button id="repeat" class="btn repeat">🔁 पूरा फिर सुनें</button>
    </div>
  </div>

  <div id="hindiPanel" class="panel explain">
    <div class="panel-title" id="hindiLabel">📖 हिंदी व्याख्या</div>
    <div id="hindiText" class="textbox"></div>
    <div class="controls">
      <button id="back" class="btn back">← पीछे</button>
      <button id="repeat2" class="btn repeat">🔁 संपूर्ण फिर सुनें</button>
    </div>
  </div>
</div>

</section>

<section id="editor" class="screen editor">
 <div class="edhead"><div><h2>✏️ पाठ संपादित करें</h2><div style="font-size:10px;opacity:.75;margin-top:3px">दोनों blocks की भाषा अलग-अलग चुनें</div></div><button id="editBack" class="icon">←</button></div>
 <div class="edcontent">
  <div class="card">
   <h3>📜 पहला ब्लॉक — संस्कृत / वैदिक पाठ</h3>
   <label class="label">भाषा</label>
   <select id="lang1" class="select">
    <option value="auto">स्वचालित</option><option value="sa-IN">संस्कृत</option><option value="hi-IN">हिंदी</option><option value="en-IN">English</option>
   </select>
   <label class="label">ऋचा / श्लोक / मंत्र / वैदिक संस्कृत गद्य</label>
   <textarea id="input1" class="textarea sanskritInput" spellcheck="false"></textarea>
  </div>
  <div class="card">
   <h3>📖 दूसरा ब्लॉक — व्याख्या</h3>
   <label class="label">भाषा</label>
   <select id="lang2" class="select">
    <option value="auto">स्वचालित</option><option value="hi-IN">हिंदी</option><option value="sa-IN">संस्कृत</option><option value="en-IN">English</option>
   </select>
   <label class="label">व्याख्या</label>
   <textarea id="input2" class="textarea hindiInput"></textarea>
  </div>
  <div class="card"><button id="save" class="btn save" style="width:100%">✓ सुरक्षित करें</button></div>
 </div>
</section>

</main></div>

<script>
'use strict';

const DEMO={
 text1:`अग्निमीळे पुरोहितं यज्ञस्य देवमृत्विजम्।
होतारं रत्नधातमम्॥

प्रथमोऽध्यायः। अथ योगानुशासनम्।`,
 lang1:'sa-IN',
 text2:`मैं अग्नि की स्तुति करता हूँ, जो यज्ञ के पुरोहित, देवता और ऋत्विज् हैं। वे होता के रूप में यज्ञीय कर्म का विधान करते हैं और श्रेष्ठ रत्नों के दाता हैं।

इस प्रकार मूल वैदिक पाठ का सरल हिंदी अर्थ समझा जा सकता है।`,
 lang2:'hi-IN'
};

let data=structuredClone(DEMO);
let voices=[];
let runId=0;
let muted=false;

const $=id=>document.getElementById(id);

function showReader(){
 $('editor').classList.remove('active');$('reader').classList.add('active');
}
function showEditor(){
 stopSpeech();
 $('reader').classList.remove('active');$('editor').classList.add('active');
}
function loadVoices(){if('speechSynthesis' in window) voices=speechSynthesis.getVoices()}

function voiceFor(lang){
 const base=String(lang||'hi-IN').split('-')[0].toLowerCase();
 const pool=voices.filter(v=>String(v.lang).toLowerCase().startsWith(base));
 const female=pool.find(v=>/female|woman|zira|neerja|kalpana|raveena|heera|swara|aditi|priya|veena|lekha/i.test(v.name+' '+v.voiceURI));
 return female||pool[0]||null;
}

function detectLang(text,fallback='hi-IN'){
 const t=String(text||'');
 if(/[ः॥]/u.test(t)) return 'sa-IN';
 if(/(?:अग्नि|ऋत|यज्ञ|मन्त्र|मंत्र|देव|होता|ऋत्विज|पुरोहित|धाता|सोऽ|ऽ)/u.test(t)) return 'sa-IN';
 if(/\b(?:है|हैं|क्या|कौन|यह|वह|में|से|को|और|का|की|के|लिए)\b/u.test(t)) return 'hi-IN';
 return fallback;
}

/* Browser voices कभी-कभी वैदिक स्वर-चिह्नों पर अटकती हैं।
   अर्थ बदले बिना केवल speech-safe normalization किया जाता है। */
function speechClean(text){
 return String(text||'').normalize('NFC')
   .replace(/[\u1CD0-\u1CFF\uA8E0-\uA8FF]/gu,'')
   .replace(/[॒॑]/gu,'')
   .replace(/ऽ/gu,' ')
   .replace(/॥/gu,'। ')
   .replace(/\s+/gu,' ').trim();
}


let rollingParts=[];
let rollingIndex=0;
let rollingBox=null;
let rollingText='';

function panelReset(){
  $('sanskritPanel').classList.add('active');
  $('hindiPanel').classList.remove('active');
  $('progress').style.width='0%';
  $('sanskritText').textContent='';
  $('hindiText').textContent='';
  rollingParts=[];
  rollingIndex=0;
  rollingBox=null;
  rollingText='';
}

function stopSpeech(){
  runId++;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  $('progress').style.width='0%';
}

function splitReadableParts(text){
  const raw=String(text||'').replace(/\r\n?/g,'\n').trim();
  if(!raw)return[];

  const lines=raw.split(/\n+/u).map(x=>x.trim()).filter(Boolean);
  const parts=[];

  for(const line of lines){
    /* पहले दण्ड/पूर्णविराम पर line break; बहुत लंबी line को छोटे भागों में बाँटें */
    const pieces=line
      .replace(/([।॥!?;])/gu,'$1\n')
      .split(/\n+/u)
      .map(x=>x.trim())
      .filter(Boolean);

    for(const piece of pieces){
      if(piece.length<=95){
        parts.push(piece);
      }else{
        const words=piece.split(/\s+/u);
        let buf='';
        for(const w of words){
          const candidate=buf?buf+' '+w:w;
          if(candidate.length>78 && buf){
            parts.push(buf);
            buf=w;
          }else{
            buf=candidate;
          }
        }
        if(buf)parts.push(buf);
      }
    }
  }
  return parts;
}

function renderRollingLine(box,text,isActive){
  const line=document.createElement('div');
  line.className='rolling-line'+(isActive?' active-line':'');
  line.textContent=text;
  box.appendChild(line);

  requestAnimationFrame(()=>{
    box.parentElement.scrollTo({
      top:box.parentElement.scrollHeight,
      behavior:'smooth'
    });
  });
}

function clearRollingBox(box){
  box.innerHTML='';
  box.scrollTop=0;
}

function speakPart(part,actual,token,onEnd){
  if(token!==runId){return}
  const u=new SpeechSynthesisUtterance(speechClean(part));
  const v=voiceFor(actual);
  if(v)u.voice=v;
  u.lang=v?.lang||actual;
  u.rate=actual==='sa-IN'?.76:.92;
  u.pitch=actual==='sa-IN'?.98:1.02;
  u.volume=1;

  u.onend=()=>{
    if(token!==runId)return;
    onEnd?.();
  };
  u.onerror=()=>{
    if(token!==runId)return;
    onEnd?.();
  };

  speechSynthesis.resume();
  speechSynthesis.speak(u);
}

function speakRolling(text,lang,token,box,onDone,onProgress){
  if(muted||!('speechSynthesis' in window)){onDone?.();return}
  const actual=lang==='auto'?detectLang(text,'hi-IN'):lang;
  const parts=splitReadableParts(text);

  rollingParts=parts;
  rollingIndex=0;
  rollingBox=box;
  rollingText=text;

  clearRollingBox(box);

  if(!parts.length){onDone?.();return}

  function next(){
    if(token!==runId)return;

    if(rollingIndex>=parts.length){
      onProgress?.(100);
      /* पूरा पाठ अंतिम रूप से एक ही display block में रख दें */
      box.innerHTML='';
      const final=document.createElement('div');
      final.className='rolling-line final-line';
      final.textContent=text;
      box.appendChild(final);
      requestAnimationFrame(()=>box.parentElement.scrollTo({
        top:box.parentElement.scrollHeight,
        behavior:'smooth'
      }));
      onDone?.();
      return;
    }

    const current=parts[rollingIndex];
    rollingIndex++;

    renderRollingLine(box,current,true);

    const percent=Math.round(((rollingIndex-1)/parts.length)*100);
    onProgress?.(percent);

    speakPart(current,actual,token,()=>{
      if(token!==runId)return;

      const activeLines=box.querySelectorAll('.active-line');
      activeLines.forEach(x=>x.classList.remove('active-line'));

      next();
    });
  }

  next();
}

function showHindiAfterSanskrit(token){
  if(token!==runId)return;

  $('sanskritPanel').classList.remove('active');
  $('hindiPanel').classList.add('active');
  $('progress').style.width='0%';
  $('hindiText').innerHTML='';

  speakRolling(
    data.text2,
    data.lang2,
    token,
    $('hindiText'),
    ()=>{
      if(token!==runId)return;
      $('progress').style.width='100%';
    },
    p=>$('progress').style.width=p+'%'
  );
}

function playFromStart(){
  stopSpeech();

  $('sanskritPanel').classList.add('active');
  $('hindiPanel').classList.remove('active');
  $('sanskritText').innerHTML='';
  $('hindiText').innerHTML='';
  $('progress').style.width='0%';

  const token=++runId;

  speakRolling(
    data.text1,
    data.lang1,
    token,
    $('sanskritText'),
    ()=>{
      if(token!==runId)return;
      $('progress').style.width='100%';
      window.setTimeout(()=>showHindiAfterSanskrit(token),180);
    },
    p=>$('progress').style.width=p+'%'
  );
}

function repeatAll(){
  playFromStart();
}

$('play').onclick=playFromStart;
$('repeat').onclick=repeatAll;
$('repeat2').onclick=repeatAll;
$('back').onclick=()=>{
  stopSpeech();
  panelReset();
};
$('mute').onclick=()=>{
  muted=!muted;
  $('mute').textContent=muted?'🔇':'🔊';
  if(muted)stopSpeech();
};
$('editOpen').onclick=()=>{
 showEditor();
 $('input1').value=data.text1;$('input2').value=data.text2;
 $('lang1').value=data.lang1;$('lang2').value=data.lang2;
};
$('editBack').onclick=showReader;
$('save').onclick=()=>{
 stopSpeech();
 data.text1=$('input1').value.trim();
 data.text2=$('input2').value.trim();
 data.lang1=$('lang1').value;data.lang2=$('lang2').value;
 panelReset();showReader();
};
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
panelReset();
</script>
</body>
</html>
